spring:
  application:
    name: localpick
  profiles:
    active: local
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

app:
  upload-dir: uploads

server:
  port: 8080
  servlet:
    session:
      timeout: 60m

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:localpick;MODE=MySQL
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: create

---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: jdbc:mysql://localhost:3306/localpick?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: localpick
    password: ${DB_PASSWORD:localpick}
  jpa:
    hibernate:
      ddl-auto: update
