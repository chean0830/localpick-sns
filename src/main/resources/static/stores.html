<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>가게 찾기 | 로컬픽</title>
  <link rel="icon" href="/img/logo.svg">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header id="header"></header>
<main class="narrow" style="max-width:720px">
  <h2>가게 찾기</h2>
  <form class="card" id="form" style="display:flex;gap:8px;margin-bottom:16px">
    <input class="input" id="q" placeholder="가게명, 업종, 동네">
    <button class="btn btn-primary">검색</button>
  </form>
  <div class="card" id="list"></div>
</main>
<script src="/js/app.js"></script>
<script>
  async function load() {
    const q = document.getElementById('q').value.trim();
    const stores = await LP.api('/api/stores?q=' + encodeURIComponent(q));
    document.getElementById('list').innerHTML = stores.length ? stores.map(s => `
      <div class="list-item">
        <a href="/store.html?id=${s.id}"><b>${LP.esc(s.name)}</b><div class="muted">${LP.esc(s.category)} · ${LP.esc(s.region)}</div></a>
        <a class="btn btn-line btn-sm" href="/store.html?id=${s.id}">보기</a>
      </div>`).join('') : '<p class="empty">가게가 없어요.</p>';
  }
  document.getElementById('form').addEventListener('submit', e => { e.preventDefault(); load(); });
  LP.renderHeader().then(load);
</script>
</body>
</html>
