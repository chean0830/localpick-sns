<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 | 로컬픽</title>
  <link rel="icon" href="/img/logo.svg">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header id="header"></header>
<main class="narrow" style="max-width:420px">
  <form class="card" id="loginForm">
    <h2 style="margin-top:0">로그인</h2>
    <div class="form-row"><label for="email">이메일</label><input class="input" type="email" id="email" required></div>
    <div class="form-row"><label for="password">비밀번호</label><input class="input" type="password" id="password" required></div>
    <p class="error" id="error"></p>
    <button class="btn btn-primary" style="width:100%">로그인</button>
    <p class="muted" style="text-align:center">아직 회원이 아니신가요? <a href="/signup.html" style="color:var(--coral)">회원가입</a></p>
    <p class="muted" style="font-size:12px">시연 계정 · user@localpick.kr / user1234 · owner@localpick.kr / owner1234</p>
  </form>
</main>
<script src="/js/app.js"></script>
<script>
  LP.renderHeader();
  document.getElementById('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    try {
      await LP.api('/api/auth/login', { method: 'POST', body: {
        email: document.getElementById('email').value,
        password: document.getElementById('password').value } });
      const next = LP.param('next');
      location.href = next && next.startsWith('/') ? next : '/';
    } catch (err) {
      document.getElementById('error').textContent = err.message;
    }
  });
</script>
</body>
</html>
